<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yimmy</title>
<style>
  /* 这里是CSS，负责"长什么样"。HTML负责"有什么内容"，CSS负责"样子"。 */

  body {
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
    background-color: #291524; /* 默认背景色，之后会被取色器实时改掉 */
    transition: background-color 0.2s ease; /* 换颜色的时候有个平滑过渡，不是硬切 */
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 12vh 28px;
    text-align: center;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }

  p {
    font-size: 1.1rem;
    line-height: 1.6;
  }

  img {
    max-width: 100%;    /* 图片不会超出容器宽度，手机上也不会溢出 */
    border-radius: 4px; /* 可选，圆角，不要也行 */
  }
  
  /* 取色器那个小工具条的样式 */
  .color-tools {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4rem;
    font-size: 0.9rem;
  }

  #hexInput {
    width: 100px;
    padding: 4px 8px;
    font-family: monospace;
  }
</style>
</head>
<body>
<main>

  <!-- 这一小块是取色工具，跟你网站正文内容无关，纯粹是个小工具 -->
  <div class="color-tools">
    <label for="colorPicker">背景色:</label>
    <input type="color" id="colorPicker" value="#ECEAE2">
    <input type="text" id="hexInput" value="#ECEAE2">
  </div>

  <img src="IMG_1544.JPG" alt="嘻嘻">
  
  <!-- 下面这两块才是你真正的网站内容，自己改这里的文字就行 -->
  <p>Yimmy701</p>
  <p>studio</p>

</main>

<script>
  // 这段JS负责让取色器和背景色联动起来

  const colorPicker = document.getElementById('colorPicker');
  const hexInput = document.getElementById('hexInput');

  // 当取色器的颜色改变时：更新背景 + 同步更新hex输入框里的文字
  colorPicker.addEventListener('input', function () {
    document.body.style.backgroundColor = colorPicker.value;
    hexInput.value = colorPicker.value;
  });

  // 当用户直接在hex输入框打字时：如果格式对，更新背景 + 同步取色器
  hexInput.addEventListener('input', function () {
    const value = hexInput.value;
    const isValidHex = /^#[0-9A-Fa-f]{6}$/.test(value);
    if (isValidHex) {
      document.body.style.backgroundColor = value;
      colorPicker.value = value;
    }
  });
</script>
</body>
</html>
